name: Build CachyOS Surface Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_type:
        description: 'Target package folder'
        required: true
        default: 'linux-cachyos-surface'
        type: choice
        options:
          - linux-cachyos-surface
          - linux-cachyos-surface-lts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space & Setup Swap
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

          echo "Setting up 8GB extra swap file..."
          sudo fallocate -l 8G /swapfile_extra
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra

          free -h
          df -h
      - name: Setup Ccache Storage
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: kernel-ccache-7.2-${{ hashFiles('linux-cachyos-surface/config') }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-7.2-${{ hashFiles('linux-cachyos-surface/config') }}-
            kernel-ccache-7.2-

      - name: Build Arch Package via CachyOS Container
        run: |
          TARGET_DIR="${{ inputs.kernel_type || 'linux-cachyos-surface' }}"
          echo "Building kernel in $TARGET_DIR..."

          mkdir -p /tmp/ccache
          chmod -R 777 /tmp/ccache "$TARGET_DIR"

          docker run --rm \
            --entrypoint bash \
            --security-opt seccomp=unconfined \
            -e EXPORT_PKG=1 \
            -e SYNC_DATABASE=1 \
            -e CCACHE_DIR=/home/notroot/.buildcache \
            -e CCACHE_MAXSIZE=6G \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_SLOPPINESS=time_macros,file_stat_matches,locale \
            -e KBUILD_BUILD_TIMESTAMP='' \
            -v /tmp/ccache:/home/notroot/.buildcache \
            -v "$PWD/$TARGET_DIR:/pkg" \
            cachyos/docker-makepkg-v3 \
            -c "sudo sed -i '/\[options\]/a DisableSandbox' /etc/pacman.conf && sudo pacman-key --init && sudo pacman-key --populate archlinux cachyos && sudo pacman -Sy --noconfirm archlinux-keyring cachyos-keyring && sudo sed -i 's/!ccache/ccache/' /etc/makepkg.conf && /run.sh"

      - name: Verify Built Packages
        run: |
          ls -lh "$TARGET_DIR"/*.pkg.tar.zst

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kernel_type || 'linux-cachyos-surface' }}-7.2-packages
          path: ${{ inputs.kernel_type || 'linux-cachyos-surface' }}/*.pkg.tar.zst
          retention-days: 7
